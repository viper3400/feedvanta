name: Release FeedVanta plugin package

on:
  push:
    tags:
      - "plugin-feedvanta-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade build twine
          python -m pip install '.[test]'

      - name: Build Tailwind stylesheet
        run: |
          npm ci
          npm run build:css
          test -s app/static/app.css

      - name: Run tests
        run: python -m pytest

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"plugin-feedvanta-v{version}"
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} does not match package version; expected {expected!r}.")
          PY

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Compose release notes
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --match 'plugin-feedvanta-v*' --abbrev=0 "${RELEASE_SHA}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commits="$(git log --pretty=format:'- `%h` %s' "${previous_tag}..${RELEASE_SHA}")"
          else
            commits="$(git log --pretty=format:'- `%h` %s' "${RELEASE_SHA}")"
          fi

          {
            cat CHANGES.md
            printf '\n## Commits\n\n%s\n' "${commits:-No commits found.}"
          } > release-notes.md

      - name: Publish distributions on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "$GITHUB_REF_NAME" --notes-file release-notes.md dist/*
