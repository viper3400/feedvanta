{% extends "base.html" %}
{% block title %}Benutzer – FeedVanta{% endblock %}
{% block content %}
<p class="mb-4"><a class="text-blue-700 hover:underline" href="{{ url_for('index') }}">← Alle Feeds</a></p><h1 class="mb-5 text-3xl font-bold">Benutzer und Berechtigungen</h1><section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">{% for user in users %}<div class="mb-2 flex flex-wrap items-center justify-between gap-4 rounded-lg bg-slate-50 p-3"><span>{% if user.picture_url %}<img src="{{ user.picture_url }}" alt="" width="28" height="28" class="mr-2 inline-block rounded-full align-middle">{% endif %}<strong>{{ user.name or user.email }}</strong><br><small class="text-slate-500">{{ user.email }}</small></span><form method="post" action="{{ url_for('update_global_administration', user_id=user.id) }}"><label class="flex items-center gap-2"><input type="checkbox" name="enabled" value="true" {% if admin_permission in user.permissions %}checked{% endif %} onchange="this.form.submit()"> Global Administration</label></form></div>{% endfor %}</section>
{% endblock %}
