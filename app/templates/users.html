<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benutzer – FeedVanta</title>
<style>:root{font-family:system-ui,sans-serif;color:#18202a;background:#f4f6f8}body{max-width:800px;margin:3rem auto;padding:0 1rem}.card{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:1.2rem;margin:1rem 0;box-shadow:0 2px 8px #0000000a}a{color:#155eef}.user{background:#f6f8fa;padding:.75rem;margin:.5rem 0;border-radius:7px;display:flex;justify-content:space-between;align-items:center;gap:1rem}</style></head>
<body><p><a href="{{ url_for('index') }}">← Alle Feeds</a></p><h1>Benutzer und Berechtigungen</h1><section class="card">{% for user in users %}<div class="user"><span>{% if user.picture_url %}<img src="{{ user.picture_url }}" alt="" width="28" height="28" style="border-radius:50%;vertical-align:middle;margin-right:.4rem">{% endif %}<strong>{{ user.name or user.email }}</strong><br><small>{{ user.email }}</small></span><form method="post" action="{{ url_for('update_global_administration', user_id=user.id) }}"><label><input type="checkbox" name="enabled" value="true" {% if admin_permission in user.permissions %}checked{% endif %} onchange="this.form.submit()"> Global Administration</label></form></div>{% endfor %}</section></body></html>
