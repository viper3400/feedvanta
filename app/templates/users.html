{% extends "base.html" %}
{% block title %}Benutzer – FeedVanta{% endblock %}
{% block content %}
<p class="mb-5"><a class="text-sm font-medium text-indigo-700 hover:text-indigo-900" href="{{ url_for('index') }}">← Alle Feeds</a></p><h1 class="mb-6 text-3xl font-bold tracking-tight">Benutzer und Berechtigungen</h1><section class="rounded-2xl border border-white bg-white/90 p-5 shadow-lg shadow-slate-200/40">{% for user in users %}<div class="mb-2 flex flex-wrap items-center justify-between gap-4 rounded-xl bg-slate-50/80 p-4"><span>{% if user.picture_url %}<img src="{{ user.picture_url }}" alt="" width="36" height="36" class="mr-3 inline-block rounded-full align-middle ring-2 ring-white">{% endif %}<strong class="text-slate-800">{{ user.name or user.email }}</strong><br><small class="ml-12 text-slate-500">{{ user.email }}</small></span><form method="post" action="{{ url_for('update_global_administration', user_id=user.id) }}"><label class="flex items-center gap-2 text-sm font-medium text-slate-700"><input class="size-4 accent-indigo-600" type="checkbox" name="enabled" value="true" {% if admin_permission in user.permissions %}checked{% endif %} onchange="this.form.submit()"> Global Administration</label></form></div>{% endfor %}</section>
{% endblock %}
