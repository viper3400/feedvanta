<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}FeedVanta{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static') }}">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-slate-100 to-indigo-50 font-sans text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <main class="mx-auto w-full max-w-5xl px-4 py-8 sm:px-6 sm:py-12">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
