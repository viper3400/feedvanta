{% extends "base.html" %}
{% block title %}Anmelden – FeedVanta{% endblock %}
{% block content %}
<main class="mx-auto mt-16 max-w-md rounded-3xl border border-white bg-white/85 p-9 text-center shadow-xl shadow-slate-300/40 backdrop-blur"><div class="mx-auto mb-5 grid size-14 place-items-center rounded-2xl bg-indigo-600 text-2xl font-bold text-white shadow-lg shadow-indigo-200">F</div><h1 class="text-3xl font-bold tracking-tight">FeedVanta</h1><p class="mt-3 leading-relaxed text-slate-600">Melde dich an, um Feeds und Filter zu verwalten.</p>{% if google_configured %}<a class="mt-7 inline-block rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white shadow-md shadow-indigo-200 transition hover:bg-indigo-700 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-600" href="{{ url_for('auth_google') }}">Anmelden mit Google</a>{% else %}<p class="mt-5 rounded-xl border border-red-100 bg-red-50 p-3 text-red-800">Google-Anmeldung ist noch nicht konfiguriert.</p>{% endif %}</main>
{% endblock %}
