{% extends "base.html" %}
{% block title %}Anmelden – FeedVanta{% endblock %}
{% block content %}
<main class="mx-auto mt-16 max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-md"><h1 class="text-3xl font-bold">FeedVanta</h1><p class="mt-3 text-slate-600">Melde dich an, um Feeds und Filter zu verwalten.</p>{% if google_configured %}<a class="mt-6 inline-block rounded-lg border border-slate-300 bg-white px-5 py-3 font-semibold text-slate-900 hover:bg-slate-50" href="{{ url_for('auth_google') }}">Anmelden mit Google</a>{% else %}<p class="mt-5 rounded-md bg-red-50 p-3 text-red-800">Google-Anmeldung ist noch nicht konfiguriert.</p>{% endif %}</main>
{% endblock %}
