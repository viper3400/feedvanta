[project]
name = "feedvanta"
version = "0.3.0"
description = "Small RSS/Atom filter server for feed readers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "apscheduler>=3.10,<4",
  "authlib>=1.3,<2",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "httpx2>=2.0,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "itsdangerous>=2.2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.entry-points."tool_host.plugins"]
feedvanta = "app.plugin:PLUGIN"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/app.css"]
